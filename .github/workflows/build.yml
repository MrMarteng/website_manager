# Checks every push and pull request; builds installers for Windows, macOS and Linux on tags
# (v*) and on demand (Actions → "Build" → "Run workflow"). A tag v* also creates a draft
# pre-release with all installers and SHA256SUMS, to be published by hand. Installers are
# unsigned (phase 3).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri and the keychain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rclone

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Release tag matches versions and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/release.py check "${{ github.ref_name }}"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: Installer ${{ matrix.name }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri and the keychain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: npm ci

      - name: Build the installer
        working-directory: apps/desktop
        run: npm run build

      - name: Build the command line program
        run: cargo build --release -p website-manager-cli

      - uses: actions/upload-artifact@v4
        with:
          name: website-manager-${{ runner.os }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/website-manager
            target/release/website-manager.exe

  release:
    name: Draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: website-manager-*
          path: artifacts

      - name: Collect installers and checksums
        run: python3 .github/scripts/release.py collect "${{ github.ref_name }}" artifacts release

      - name: Release notes from the changelog
        run: python3 .github/scripts/release.py notes "${{ github.ref_name }}" release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Website Manager ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
