name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom (website owner, agency)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? Mock-ups or examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions you considered.
