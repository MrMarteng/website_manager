[workspace]
resolver = "2"
members = ["crates/core", "crates/deploy", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://git.nas.local/teleschirm/website-manager"
rust-version = "1.85"

[workspace.dependencies]
wm-core = { path = "crates/core" }
teleschirm-deploy = { path = "crates/deploy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
ureq = "2"
flate2 = "1"
tar = "0.4"
tempfile = "3"
argon2 = "0.5"
aes-gcm = "0.10"
rpassword = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
trash = "5"

# Key derivation is slow without optimisation; keep tests and debug builds usable.
[profile.dev.package.argon2]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
