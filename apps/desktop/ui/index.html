<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img src="img/logo.svg" alt="" class="logo">
    <h1><button class="link" id="home" data-i18n="appTitle"></button></h1>
    <select id="language" aria-label="Sprache / Language">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <p id="error" class="error hidden" role="alert"></p>

    <!-- Start: open a package or pick a known project -->
    <section id="start-view">
      <div class="card drop" id="drop-zone">
        <h2 data-i18n="openTitle"></h2>
        <p class="muted" data-i18n="openHint"></p>
        <button class="primary" id="open-button" data-i18n="openButton"></button>
      </div>
      <div class="card hidden" id="projects-card">
        <h2 data-i18n="projectsTitle"></h2>
        <ul class="list" id="projects"></ul>
      </div>
    </section>

    <!-- Project -->
    <section id="project-view" class="hidden">
      <div class="project-head">
        <h2 id="project-title"></h2>
        <span class="muted" id="project-version"></span>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="overview" data-i18n="tabOverview"></button>
        <button role="tab" data-tab="upload" data-i18n="tabUpload"></button>
        <button role="tab" data-tab="versions" data-i18n="tabVersions"></button>
        <button role="tab" data-tab="settings" data-i18n="tabSettings"></button>
        <button role="tab" data-tab="files" data-i18n="tabFiles"></button>
      </nav>

      <!-- Overview -->
      <div class="tab" id="tab-overview">
        <div class="card notice hidden" id="open-notice"></div>
        <div class="card warning hidden" id="changed-notice">
          <p data-i18n="locallyChanged"></p>
          <ul id="changed-files" class="small"></ul>
        </div>
        <div class="card hidden" id="credentials-card">
          <h3 data-i18n="credentialsTitle"></h3>
          <p class="muted" data-i18n="credentialsHint"></p>
          <label class="field"><span data-i18n="packagePassword"></span>
            <input type="password" id="package-password" autocomplete="off"></label>
          <div class="row"><button class="primary" id="credentials-import" data-i18n="credentialsImport"></button></div>
        </div>
        <div class="card">
          <dl class="facts">
            <dt data-i18n="version"></dt><dd id="fact-version"></dd>
            <dt data-i18n="created"></dt><dd id="fact-created"></dd>
            <dt data-i18n="publisher"></dt><dd id="fact-publisher"></dd>
          </dl>
          <div id="changelog-box" class="hidden">
            <h3 data-i18n="changes"></h3>
            <ul id="changelog"></ul>
          </div>
          <div class="row">
            <button id="compliance-open" class="hidden" data-i18n="complianceOpen"></button>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="previewTitle"></h3>
          <p class="muted" data-i18n="previewHint"></p>
          <div class="row">
            <button class="primary" id="preview-start" data-i18n="previewStart"></button>
            <button id="preview-stop" class="hidden" data-i18n="previewStop"></button>
            <span id="preview-url" class="muted"></span>
          </div>
        </div>
      </div>

      <!-- Upload -->
      <div class="tab hidden" id="tab-upload">
        <div class="card">
          <p class="muted hidden" id="no-deploy" data-i18n="noDeploy"></p>
          <div id="upload-form">
            <fieldset>
              <label><input type="radio" name="target" value="server" checked> <span data-i18n="targetServer"></span> <span class="muted" id="server-name"></span></label>
              <label><input type="radio" name="target" value="local"> <span data-i18n="targetLocal"></span></label>
            </fieldset>
            <p class="muted" id="credentials-state"></p>
            <label class="field" id="password-field"><span data-i18n="password"></span>
              <input type="password" id="password" autocomplete="off"></label>
            <label class="field hidden" id="folder-field"><span data-i18n="localFolder"></span>
              <input type="text" id="local-folder"></label>
            <label class="check warning hidden" id="unverified-field">
              <input type="checkbox" id="accept-unverified"> <span id="unverified-text"></span></label>
            <div class="row">
              <button id="upload-check" data-i18n="uploadCheck"></button>
              <button class="primary" id="upload-run" data-i18n="uploadRun"></button>
              <button id="website-open" class="hidden" data-i18n="websiteOpen"></button>
            </div>
          </div>
        </div>
        <div class="card hidden" id="upload-progress-card">
          <p id="upload-status" role="status"></p>
          <p class="small muted" id="upload-line"></p>
          <details id="changes-details" class="hidden">
            <summary id="changes-summary"></summary>
            <ul class="small" id="changes-list"></ul>
          </details>
        </div>
      </div>

      <!-- Versions -->
      <div class="tab hidden" id="tab-versions">
        <div class="card">
          <p class="muted" data-i18n="versionsHint"></p>
          <ul class="list" id="versions"></ul>
        </div>
      </div>

      <!-- Settings -->
      <div class="tab hidden" id="tab-settings">
        <form class="card" id="settings-form">
          <h3 data-i18n="serverTitle"></h3>
          <p class="muted" data-i18n="settingsHint"></p>
          <div class="grid">
            <label class="field"><span data-i18n="protocol"></span>
              <select id="set-protocol"><option value="sftp">SFTP</option><option value="ftps">FTPS</option></select></label>
            <label class="field"><span data-i18n="host"></span><input type="text" id="set-host"></label>
            <label class="field"><span data-i18n="user"></span><input type="text" id="set-user"></label>
            <label class="field"><span data-i18n="port"></span><input type="number" id="set-port" min="1" max="65535"></label>
            <label class="field"><span data-i18n="remoteRoot"></span><input type="text" id="set-root"></label>
            <label class="field"><span data-i18n="domain"></span><input type="text" id="set-domain" placeholder="www.example.com"></label>
          </div>
          <details id="expert-mappings">
            <summary data-i18n="expertMappings"></summary>
            <p class="small warning" data-i18n="expertWarning"></p>
            <table class="small" id="mappings-table"></table>
            <textarea id="set-mappings" rows="6" spellcheck="false"></textarea>
          </details>
          <div class="row">
            <button class="primary" type="submit" data-i18n="save"></button>
            <button type="button" id="settings-reset" data-i18n="resetSettings"></button>
          </div>
        </form>
        <div class="card">
          <h3 data-i18n="accessTitle"></h3>
          <p class="muted" id="access-state"></p>
          <label class="field"><span data-i18n="transferPassword"></span>
            <input type="password" id="transfer-password" autocomplete="off"></label>
          <div class="row">
            <button id="access-export" data-i18n="accessExport"></button>
            <button id="access-import" data-i18n="accessImport"></button>
            <button id="access-forget" data-i18n="accessForget"></button>
          </div>
        </div>
      </div>

      <!-- Files -->
      <div class="tab hidden" id="tab-files">
        <div class="card">
          <div class="row">
            <input type="text" id="file-filter" data-i18n-placeholder="fileFilter">
            <button id="reveal" data-i18n="reveal"></button>
          </div>
          <p class="small muted" data-i18n="filesHint"></p>
          <ul class="list small" id="files"></ul>
        </div>
      </div>
    </section>

    <details class="card" id="expert">
      <summary data-i18n="logTitle"></summary>
      <div class="row">
        <button id="log-refresh" data-i18n="logRefresh"></button>
        <button id="log-export" data-i18n="logExport"></button>
      </div>
      <pre id="log"></pre>
    </details>
  </main>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
